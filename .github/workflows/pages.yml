name: Deploy Wikascolemon su GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - name: Prepara sito e demo
        shell: bash
        run: |
          mkdir -p _site/Pokemon_Ascoli
          cp -R Wikascolemon/. _site/
          cp -R "schede _Pokemon/Pokemon_Ascoli/." _site/Pokemon_Ascoli/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
