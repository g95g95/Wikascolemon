<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="640" viewBox="0 0 1024 640" role="img" aria-labelledby="title desc">
  <title id="title">Mappa illustrata della Regione Piceno</title>
  <desc id="desc">Mappa vettoriale in stile videogioco della valle del Tronto, da Acquasanta Terme alla costa adriatica.</desc>
